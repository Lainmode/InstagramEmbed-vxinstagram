# Local-only smoke testing. Production overlay: ../deploy/compose.vxinstagram.yml
services:
  vxinstagram:
    build:
      context: ..
      dockerfile: Dockerfile
    image: vxinstagram:local
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      Instance__PublicUrl: http://localhost:8080
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
